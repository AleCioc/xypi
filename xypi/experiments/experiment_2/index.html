<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XYPI Experiment 2 — Web Mixer</title>
  <link rel="stylesheet" href="../shared/viewer/style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>XYPI Experiment 2</h1>
        <p class="subtitle">Web mixer · four polygon channels from experiment_0</p>
      </div>
      <div class="mix-controls">
        <button id="play-btn" type="button">&#9654; Play</button>
        <button id="stop-btn" type="button">&#9632; Stop</button>
        <button id="mute-all-btn" type="button">Mute all</button>
        <span id="status">Loading…</span>
      </div>
    </div>
  </header>

  <main id="mixer"></main>

  <script src="../shared/viewer/player.js"></script>
  <script>
    window.XYPI_DEFAULT_CHANNELS = [
      "../experiment_0/output/poly_a_synth.geojson",
      "../experiment_0/output/poly_b_synth.geojson",
      "../experiment_0/output/poly_c_sample.geojson",
      "../experiment_0/output/poly_d_sample.geojson",
    ];
    document.addEventListener("DOMContentLoaded", () => XYPIPlayer.init());
  </script>
</body>
</html>
