[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xypi"
version = "0.1.0"
description = "Geospatial patterns mapped to musical channels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "shapely>=2.0",
    "geopandas>=0.14",
    "numpy>=1.24",
    "python-osc>=1.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xypi*"]
